<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Builder – Tạo Đề Thi Trắc Nghiệm</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF6B35;
  --yellow: #FFD166;
  --green: #06D6A0;
  --blue: #118AB2;
  --dark: #1a1a2e;
  --bg: #f0f4ff;
  --card: #ffffff;
  --shadow: 0 8px 32px rgba(0,0,0,0.10);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; }

/* ═══ TABS ═══ */
.tabs {
  display: flex;
  background: var(--dark);
  position: sticky; top: 0; z-index: 100;
}
.tab-btn {
  flex: 1; padding: 16px; border: none; background: transparent;
  color: rgba(255,255,255,0.5); font-family: 'Baloo 2', cursive;
  font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: all 0.2s; border-bottom: 3px solid transparent;
}
.tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }
.tab-btn:hover:not(.active) { color: rgba(255,255,255,0.8); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ═══ EDITOR PANEL ═══ */
.editor-wrap {
  max-width: 860px; margin: 0 auto; padding: 24px 20px;
}

.editor-header {
  background: linear-gradient(135deg, #1a1a2e, #0f3460);
  border-radius: var(--radius); padding: 24px 28px; margin-bottom: 24px;
  color: white;
}
.editor-header h2 { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; }
.editor-header p { opacity: 0.65; font-size: 0.88rem; margin-top: 4px; }

/* Meta form */
.meta-form {
  background: white; border-radius: var(--radius); padding: 22px 24px;
  margin-bottom: 20px; box-shadow: var(--shadow);
}
.meta-form h3 { font-family: 'Baloo 2', cursive; font-size: 1.05rem; color: var(--dark); margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 0.8rem; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select {
  padding: 9px 13px; border: 2px solid #e8e8e8; border-radius: 10px;
  font-family: 'Nunito', sans-serif; font-size: 0.92rem; font-weight: 600;
  outline: none; transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--blue); }

/* Question cards in editor */
.q-editor-list { display: flex; flex-direction: column; gap: 16px; }

.q-editor-card {
  background: white; border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.q-editor-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; background: #f8f9ff; border-bottom: 1px solid #eee;
}
.q-num-badge {
  background: var(--dark); color: white; border-radius: 50px;
  padding: 3px 12px; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.85rem;
}
.pts-select {
  padding: 4px 10px; border: 2px solid #e8e8e8; border-radius: 50px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.8rem;
  cursor: pointer; background: white;
}
.btn-del-q {
  margin-left: auto; background: #fee2e2; border: none; color: #dc2626;
  border-radius: 50px; padding: 4px 12px; font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: background 0.2s;
}
.btn-del-q:hover { background: #fca5a5; }

.q-editor-body { padding: 16px 18px; }

.q-text-input {
  width: 100%; padding: 10px 14px; border: 2px solid #e8e8e8; border-radius: 10px;
  font-family: 'Nunito', sans-serif; font-size: 0.93rem; font-weight: 600;
  resize: vertical; min-height: 70px; outline: none; transition: border-color 0.2s;
  margin-bottom: 14px;
}
.q-text-input:focus { border-color: var(--blue); }

/* Image upload */
.img-upload-area {
  border: 2px dashed #d1d5db; border-radius: 10px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  cursor: pointer; transition: border-color 0.2s; background: #fafafa;
}
.img-upload-area:hover { border-color: var(--blue); background: #f0f7ff; }
.img-upload-area input { display: none; }
.img-upload-area span { font-size: 0.83rem; color: #888; font-weight: 700; }
.img-preview { max-width: 100%; max-height: 180px; border-radius: 8px; display: none; margin-bottom: 12px; }

/* Options */
.opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.opt-row { display: flex; align-items: center; gap: 8px; }
.opt-label {
  min-width: 28px; height: 28px; border-radius: 50%; background: #f0f0f0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.8rem; color: #666; flex-shrink: 0;
}
.opt-input {
  flex: 1; padding: 8px 11px; border: 2px solid #e8e8e8; border-radius: 9px;
  font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 600;
  outline: none; transition: all 0.2s;
}
.opt-input:focus { border-color: var(--blue); }
.opt-radio { cursor: pointer; width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }

/* Correct answer indicator */
.opt-row.is-correct .opt-label { background: var(--green); color: #111; }
.opt-row.is-correct .opt-input { border-color: var(--green); background: #f0fdf9; }

.hint-explain-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-group label { font-size: 0.75rem; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 4px; }
.field-group textarea {
  width: 100%; padding: 8px 11px; border: 2px solid #e8e8e8; border-radius: 9px;
  font-family: 'Nunito', sans-serif; font-size: 0.85rem; resize: vertical; min-height: 60px;
  outline: none; transition: border-color 0.2s;
}
.field-group textarea:focus { border-color: var(--orange); }

.correct-hint { font-size: 0.75rem; color: #888; margin-bottom: 10px; }
.correct-hint span { color: var(--green); font-weight: 700; }

/* Add question button */
.btn-add-q {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px; border: 2px dashed #c7d2fe; border-radius: var(--radius);
  background: white; color: var(--blue); font-family: 'Baloo 2', cursive;
  font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;
  margin-top: 4px;
}
.btn-add-q:hover { background: #eff6ff; border-color: var(--blue); transform: translateY(-2px); }

/* Action buttons */
.action-bar {
  display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
}
.btn-primary {
  flex: 1; padding: 14px 20px; background: linear-gradient(135deg, var(--orange), #ff8c42);
  border: none; border-radius: 50px; color: white; font-family: 'Baloo 2', cursive;
  font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(255,107,53,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.45); }
.btn-secondary {
  padding: 14px 20px; background: white; border: 2px solid #e8e8e8;
  border-radius: 50px; color: #555; font-family: 'Baloo 2', cursive;
  font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
}
.btn-secondary:hover { border-color: var(--blue); color: var(--blue); }

/* ═══ PREVIEW PANEL ═══ */
#preview-panel { background: var(--bg); }

.preview-header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: white; padding: 28px 20px 22px; text-align: center; position: relative; overflow: hidden;
}
.preview-header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 50%, rgba(255,107,53,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.preview-header h1 { font-family: 'Baloo 2', cursive; font-size: 1.8rem; font-weight: 800; position: relative; }
.preview-header h1 span { color: var(--yellow); }
.preview-header p { opacity: 0.65; font-size: 0.88rem; margin-top: 5px; position: relative; }

.scoreboard { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; position: relative; }
.score-chip {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50px; padding: 5px 16px; font-size: 0.83rem; font-weight: 700; backdrop-filter: blur(8px);
}
.score-chip .val { color: var(--yellow); font-size: 1rem; }

.progress-bar-wrap { max-width: 860px; margin: 14px auto 0; padding: 0 20px; }
.progress-bar { height: 7px; background: #e2e8f0; border-radius: 50px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--blue)); border-radius: 50px; transition: width 0.5s; width: 0%; }
.progress-label { font-size: 0.78rem; color: #888; margin-top: 5px; text-align: right; font-weight: 700; }

.preview-container { max-width: 860px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }

.q-card {
  background: white; border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; animation: fadeUp 0.35s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.q-card:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,0.14); }
.q-card-header {
  padding: 12px 18px 10px; display: flex; align-items: center; gap: 9px;
  border-bottom: 1px solid #f0f0f0;
}
.pts-badge {
  font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.76rem;
  padding: 3px 10px; border-radius: 50px; color: white;
}
.pts-3 { background: var(--green); color: #111; }
.pts-4 { background: var(--blue); }
.pts-5 { background: var(--orange); }
.q-card-num { margin-left: auto; font-size: 0.8rem; color: #ccc; font-weight: 700; }

.q-card-body { padding: 16px 18px 8px; }
.q-card-text { font-size: 0.97rem; line-height: 1.68; font-weight: 600; color: #222; margin-bottom: 12px; }
.q-card-img { max-width: 100%; border-radius: 10px; margin-bottom: 12px; display: block; }

.hint-box {
  background: #fff8e1; border-left: 4px solid var(--yellow); border-radius: 0 8px 8px 0;
  padding: 8px 12px; font-size: 0.83rem; color: #666; margin-bottom: 12px; display: none;
}
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
.opt-btn {
  padding: 10px 13px; border: 2px solid #e8e8e8; border-radius: 11px; background: #fafafa;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.89rem;
  cursor: pointer; text-align: left; transition: all 0.18s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--blue); background: #f0f7ff; transform: translateX(3px); }
.opt-btn.correct { border-color: var(--green); background: #e8fdf6; color: #047857; }
.opt-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
.opt-btn.correct::after { content: ' ✓'; }
.opt-btn.wrong::after { content: ' ✗'; }

.q-card-footer { padding: 8px 18px 14px; display: flex; gap: 8px; }
.btn-hint, .btn-explain {
  padding: 6px 13px; border-radius: 50px; border: none;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.18s;
}
.btn-hint { background: #fff3cd; color: #92400e; }
.btn-hint:hover { background: #fde68a; }
.btn-explain { background: #e0f2fe; color: #0369a1; }
.btn-explain:hover { background: #bae6fd; }

.explanation {
  margin: 0 18px 14px; padding: 12px 15px;
  background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
  border: 1px solid #a7f3d0; border-radius: 13px;
  font-size: 0.86rem; line-height: 1.7; color: #064e3b; display: none;
}
.explanation strong { display: block; margin-bottom: 3px; color: #047857; font-size: 0.87rem; }

.empty-preview {
  text-align: center; padding: 60px 20px; color: #aaa;
}
.empty-preview .big { font-size: 3rem; margin-bottom: 10px; }
.empty-preview p { font-size: 1rem; font-weight: 700; }

.celebrate {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 4rem; pointer-events: none; z-index: 999; display: none;
  animation: pop 0.8s ease forwards;
}
@keyframes pop {
  0% { opacity:1; transform:translate(-50%,-50%) scale(0.5); }
  50% { transform:translate(-50%,-65%) scale(1.5); }
  100% { opacity:0; transform:translate(-50%,-85%) scale(1); }
}

/* reset btn */
.btn-reset {
  display: block; margin: 0 auto 24px; padding: 9px 24px;
  background: white; border: 2px solid #e8e8e8; border-radius: 50px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem;
  cursor: pointer; color: #666; transition: all 0.2s;
}
.btn-reset:hover { border-color: var(--orange); color: var(--orange); }

@media (max-width: 600px) {
  .form-row, .opts-grid, .hint-explain-row, .options-grid { grid-template-columns: 1fr; }
  .preview-header h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('editor')">✏️ Soạn đề</button>
  <button class="tab-btn" onclick="switchTab('preview')">🎯 Luyện tập</button>
</div>

<!-- ═══ EDITOR TAB ═══ -->
<div id="editor-panel" class="tab-panel active">
  <div class="editor-wrap">

    <div class="editor-header">
      <h2>✏️ Soạn đề thi trắc nghiệm</h2>
      <p>Nhập câu hỏi, đáp án, gợi ý rồi bấm "Xem trước & Luyện tập"</p>
    </div>

    <!-- Meta -->
    <div class="meta-form">
      <h3>📋 Thông tin đề thi</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Tên đề thi</label>
          <input type="text" id="meta-title" placeholder="VD: IKMC 2025 – Lớp 3&4" value="Đề thi trắc nghiệm">
        </div>
        <div class="form-group">
          <label>Dành cho</label>
          <input type="text" id="meta-student" placeholder="VD: Đỗ Đức Toàn">
        </div>
        <div class="form-group">
          <label>Môn / Chủ đề</label>
          <input type="text" id="meta-subject" placeholder="VD: Toán – IKMC">
        </div>
        <div class="form-group">
          <label>Mô tả ngắn</label>
          <input type="text" id="meta-desc" placeholder="VD: Cấp độ Ecolier 2025">
        </div>
      </div>
    </div>

    <!-- Questions -->
    <div class="q-editor-list" id="q-list"></div>

    <button class="btn-add-q" onclick="addQuestion()">➕ Thêm câu hỏi mới</button>

    <div class="action-bar">
      <button class="btn-primary" onclick="buildPreview()">🎯 Xem trước & Luyện tập</button>
      <button class="btn-secondary" onclick="exportHTML()">💾 Xuất file HTML</button>
      <button class="btn-secondary" onclick="clearAll()">🗑️ Xóa tất cả</button>
    </div>

  </div>
</div>

<!-- ═══ PREVIEW TAB ═══ -->
<div id="preview-panel" class="tab-panel">
  <div class="preview-header">
    <h1 id="prev-title">🦘 <span>Đề Thi</span></h1>
    <p id="prev-desc">Nhập thông tin và bấm "Xem trước" để bắt đầu</p>
    <div class="scoreboard">
      <div class="score-chip">Đúng: <span class="val" id="sc-right">0</span></div>
      <div class="score-chip">Sai: <span class="val" id="sc-wrong">0</span></div>
      <div class="score-chip">Điểm: <span class="val" id="sc-pts">0</span></div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="progress-label" id="prog-label">0 / 0 câu</div>
  </div>
  <div class="preview-container" id="preview-container">
    <div class="empty-preview">
      <div class="big">📝</div>
      <p>Soạn đề xong rồi bấm<br>"Xem trước & Luyện tập"</p>
    </div>
  </div>
  <button class="btn-reset" onclick="resetAnswers()">🔄 Làm lại từ đầu</button>
</div>

<div class="celebrate" id="celebrate">🎉</div>

<script>
// ── State ──
let questions = [];
let answered = new Set();
let correct = 0, wrong = 0, totalPts = 0;
let qIdCounter = 0;
let imgData = {}; // qId → base64 data URL

// ── Init: add 1 question by default ──
addQuestion();

function addQuestion() {
  const id = ++qIdCounter;
  questions.push({ id, pts: 3, text: '', opts: ['','','','',''], ans: 0, hint: '', explain: '' });
  renderEditor();
}

function removeQuestion(id) {
  questions = questions.filter(q => q.id !== id);
  delete imgData[id];
  renderEditor();
}

function renderEditor() {
  const list = document.getElementById('q-list');
  list.innerHTML = '';
  questions.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'q-editor-card';
    div.innerHTML = `
      <div class="q-editor-header">
        <span class="q-num-badge">Câu ${idx + 1}</span>
        <select class="pts-select" onchange="updateQ(${q.id},'pts',+this.value)">
          <option value="3" ${q.pts==3?'selected':''}>3 điểm</option>
          <option value="4" ${q.pts==4?'selected':''}>4 điểm</option>
          <option value="5" ${q.pts==5?'selected':''}>5 điểm</option>
        </select>
        <button class="btn-del-q" onclick="removeQuestion(${q.id})">✕ Xóa</button>
      </div>
      <div class="q-editor-body">

        <textarea class="q-text-input" placeholder="Nhập nội dung câu hỏi..."
          onchange="updateQ(${q.id},'text',this.value)">${q.text}</textarea>

        <label class="img-upload-area" for="img-${q.id}">
          <input type="file" id="img-${q.id}" accept="image/*" onchange="handleImg(${q.id},this)">
          <span>🖼️ ${imgData[q.id] ? 'Đổi hình ảnh' : 'Chèn hình ảnh (tuỳ chọn)'}</span>
          ${imgData[q.id] ? `<button type="button" onclick="removeImg(event,${q.id})" style="margin-left:auto;background:#fee2e2;border:none;border-radius:50px;padding:3px 10px;font-size:0.75rem;font-weight:700;color:#dc2626;cursor:pointer;">✕ Xóa hình</button>` : ''}
        </label>
        ${imgData[q.id] ? `<img class="img-preview" src="${imgData[q.id]}" style="display:block;max-width:100%;max-height:180px;border-radius:8px;margin-bottom:12px;">` : ''}

        <p class="correct-hint">👆 Chọn <span>nút tròn ●</span> bên phải mỗi đáp án để đánh dấu đáp án đúng</p>
        <div class="opts-grid">
          ${['A','B','C','D','E'].map((l,i) => `
            <div class="opt-row ${q.ans===i?'is-correct':''}">
              <span class="opt-label">${l}</span>
              <input class="opt-input" type="text" placeholder="Đáp án ${l}..."
                value="${q.opts[i]||''}"
                onchange="updateOpt(${q.id},${i},this.value)">
              <input type="radio" class="opt-radio" name="ans-${q.id}" value="${i}"
                ${q.ans===i?'checked':''} onchange="updateQ(${q.id},'ans',${i});renderEditor()">
            </div>
          `).join('')}
        </div>

        <div class="hint-explain-row">
          <div class="field-group">
            <label>💡 Gợi ý (tuỳ chọn)</label>
            <textarea placeholder="Gợi ý để học sinh suy nghĩ thêm..."
              onchange="updateQ(${q.id},'hint',this.value)">${q.hint}</textarea>
          </div>
          <div class="field-group">
            <label>📖 Giải thích đáp án (tuỳ chọn)</label>
            <textarea placeholder="Hướng dẫn giải chi tiết..."
              onchange="updateQ(${q.id},'explain',this.value)">${q.explain}</textarea>
          </div>
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

function updateQ(id, field, val) {
  const q = questions.find(x => x.id === id);
  if (q) q[field] = val;
}
function updateOpt(id, i, val) {
  const q = questions.find(x => x.id === id);
  if (q) q.opts[i] = val;
}

function handleImg(id, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { imgData[id] = e.target.result; renderEditor(); };
  reader.readAsDataURL(file);
}
function removeImg(e, id) {
  e.preventDefault(); e.stopPropagation();
  delete imgData[id];
  renderEditor();
}

// ── Build Preview ──
function buildPreview() {
  answered = new Set(); correct = 0; wrong = 0; totalPts = 0;

  const title = document.getElementById('meta-title').value || 'Đề Thi';
  const student = document.getElementById('meta-student').value;
  const desc = document.getElementById('meta-desc').value || '';
  const subject = document.getElementById('meta-subject').value || '';

  document.getElementById('prev-title').innerHTML =
    `🦘 <span>${title}</span>`;
  document.getElementById('prev-desc').textContent =
    [subject, desc, student ? `Dành cho: ${student}` : ''].filter(Boolean).join(' · ');

  updateScore(); updateProgress();

  const container = document.getElementById('preview-container');
  container.innerHTML = '';

  if (questions.length === 0) {
    container.innerHTML = `<div class="empty-preview"><div class="big">😅</div><p>Chưa có câu hỏi nào!</p></div>`;
    switchTab('preview'); return;
  }

  questions.forEach((q, idx) => {
    if (!q.text.trim() && !imgData[q.id]) return;

    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.animationDelay = `${idx * 0.05}s`;

    const validOpts = q.opts.filter(o => o.trim());
    const optsHTML = validOpts.map((o, i) =>
      `<button class="opt-btn" id="popt-${q.id}-${i}" onclick="pickAns(${q.id},${i},${q.ans},${q.pts})">${['A','B','C','D','E'][i]}) ${o}</button>`
    ).join('');

    card.innerHTML = `
      <div class="q-card-header">
        <span class="pts-badge pts-${q.pts}">${q.pts} điểm</span>
        <span style="font-size:.8rem;font-weight:700;color:#999;">Câu ${idx+1}</span>
        <span class="q-card-num">#${idx+1}</span>
      </div>
      <div class="q-card-body">
        ${q.text ? `<div class="q-card-text">${q.text}</div>` : ''}
        ${imgData[q.id] ? `<img class="q-card-img" src="${imgData[q.id]}">` : ''}
        ${q.hint ? `<div class="hint-box" id="phint-${q.id}">💡 <strong>Gợi ý:</strong> ${q.hint}</div>` : ''}
        <div class="options-grid">${optsHTML}</div>
      </div>
      ${q.hint || q.explain ? `
      <div class="q-card-footer">
        ${q.hint ? `<button class="btn-hint" onclick="toggleEl('phint-${q.id}')">💡 Gợi ý</button>` : ''}
        ${q.explain ? `<button class="btn-explain" onclick="toggleEl('pexp-${q.id}')">📖 Giải thích</button>` : ''}
      </div>` : ''}
      ${q.explain ? `<div class="explanation" id="pexp-${q.id}"><strong>✅ Hướng dẫn giải:</strong> ${q.explain}</div>` : ''}
    `;
    container.appendChild(card);
  });

  updateProgress();
  switchTab('preview');
}

function pickAns(qId, chosen, correctAns, pts) {
  if (answered.has(qId)) return;
  answered.add(qId);

  const isRight = chosen === correctAns;
  if (isRight) { correct++; totalPts += pts; showCelebrate(); }
  else wrong++;

  const q = questions.find(x => x.id === qId);
  const validOpts = q.opts.filter(o => o.trim());
  validOpts.forEach((_, i) => {
    const btn = document.getElementById(`popt-${qId}-${i}`);
    if (!btn) return;
    btn.disabled = true;
    if (i === correctAns) btn.classList.add('correct');
    else if (i === chosen && !isRight) btn.classList.add('wrong');
  });

  if (q.explain) {
    const exp = document.getElementById(`pexp-${qId}`);
    if (exp) exp.style.display = 'block';
  }

  updateScore(); updateProgress();
}

function toggleEl(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function updateScore() {
  document.getElementById('sc-right').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-pts').textContent = totalPts;
}

function updateProgress() {
  const total = questions.filter(q => q.text.trim() || imgData[q.id]).length;
  const done = answered.size;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done} / ${total} câu đã trả lời`;
}

function resetAnswers() {
  answered = new Set(); correct = 0; wrong = 0; totalPts = 0;
  buildPreview();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab + '-panel').classList.add('active');
  document.querySelectorAll('.tab-btn')[tab === 'editor' ? 0 : 1].classList.add('active');
}

function showCelebrate() {
  const el = document.getElementById('celebrate');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 800);
}

function clearAll() {
  if (!confirm('Xóa tất cả câu hỏi?')) return;
  questions = []; imgData = {}; qIdCounter = 0;
  addQuestion();
}

    explain:${JSON.stringify(q.explain)}
  }`).join(',\n');

  const html = `<!DOCTYPE html>
